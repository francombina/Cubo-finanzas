<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubo Finanzas — Dashboard & Configuración de APIs</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cubo: {
                            navy: '#1A3644',
                            teal: '#2C4E5E',
                            mint: '#A0D8C3',
                            bg: '#F4F7F6',
                            card: '#FFFFFF'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- html2canvas para exportar la infografía a PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-cubo-bg text-cubo-navy font-sans antialiased min-h-screen pb-12">

    <!-- Header Principal -->
    <header class="bg-cubo-navy text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-cubo-mint p-2.5 rounded-xl text-cubo-navy font-black text-2xl tracking-tighter shadow-inner">
                    CF
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">CUBO FINANZAS</h1>
                    <p class="text-xs text-cubo-mint font-medium">Dashboard de Mercado & Los Números de la Semana</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="sincronizarTodasLasAPIs()" class="flex items-center gap-1.5 bg-cubo-teal hover:bg-opacity-90 text-white px-3 py-2 rounded-lg text-xs font-bold transition shadow-sm">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> Sincronizar
                </button>
                <button onclick="toggleConfigPanel()" class="flex items-center gap-1.5 bg-cubo-mint hover:bg-opacity-90 text-cubo-navy px-3 py-2 rounded-lg text-xs font-bold transition shadow-sm">
                    <i data-lucide="settings" class="w-4 h-4"></i> Configurar Fuentes
                </button>
                <button onclick="abrirModalEdicion()" class="flex items-center gap-1.5 bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-lg text-xs font-bold transition shadow-sm">
                    <i data-lucide="edit-3" class="w-4 h-4"></i> Edición Manual
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto px-4 mt-8 space-y-8">

        <!-- PANEL DE CONFIGURACIÓN DE APIS (DESPLEGABLE) -->
        <section id="panel-configuracion" class="bg-white border-2 border-cubo-teal p-6 rounded-2xl shadow-lg hidden space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <div class="flex items-center gap-2">
                    <span class="p-2 bg-cubo-navy text-cubo-mint rounded-lg"><i data-lucide="sliders" class="w-5 h-5"></i></span>
                    <div>
                        <h3 class="font-extrabold text-lg text-cubo-navy">Configuración de Fuentes & Endpoints APIs</h3>
                        <p class="text-xs text-gray-500">Indica la URL correspondiente para cada indicador. Se guardará en tu navegador.</p>
                    </div>
                </div>
                <button onclick="toggleConfigPanel()" class="text-gray-400 hover:text-gray-600 font-bold text-sm">✕ Cerrar</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <div>
                    <label class="block font-bold text-gray-700 mb-1">URL API Dólar MEP</label>
                    <input type="text" id="cfg-api-mep" class="w-full border p-2 rounded text-xs font-mono bg-gray-50">
                </div>

                <div>
                    <label class="block font-bold text-gray-700 mb-1">URL API Dólar Oficial</label>
                    <input type="text" id="cfg-api-oficial" class="w-full border p-2 rounded text-xs font-mono bg-gray-50">
                </div>

                <div>
                    <label class="block font-bold text-gray-700 mb-1">URL API Riesgo País</label>
                    <input type="text" id="cfg-api-riesgo" class="w-full border p-2 rounded text-xs font-mono bg-gray-50">
                </div>

                <div>
                    <label class="block font-bold text-gray-700 mb-1">URL API Reservas BCRA</label>
                    <input type="text" id="cfg-api-reservas" class="w-full border p-2 rounded text-xs font-mono bg-gray-50">
                </div>

                <div>
                    <label class="block font-bold text-gray-700 mb-1">URL API / Endpoint Merval USD</label>
                    <input type="text" id="cfg-api-merval" class="w-full border p-2 rounded text-xs font-mono bg-gray-50">
                </div>

                <div>
                    <label class="block font-bold text-gray-700 mb-1">URL API / Endpoint S&P 500</label>
                    <input type="text" id="cfg-api-sp500" class="w-full border p-2 rounded text-xs font-mono bg-gray-50">
                </div>
            </div>

            <div class="flex justify-between items-center border-t pt-4">
                <button onclick="restaurarConfiguracionPorDefecto()" class="text-xs text-rose-600 hover:underline font-bold">
                    Restaurar Fuentes por Defecto
                </button>
                <button onclick="guardarConfiguracionAPIs()" class="bg-cubo-navy hover:bg-cubo-teal text-white px-5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Guardar y Consultar APIs
                </button>
            </div>
        </section>

        <!-- Estado de Conexión y Estado de Fuentes -->
        <div class="bg-white border border-gray-200 p-4 rounded-xl shadow-sm flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <span class="p-2 bg-cubo-navy text-cubo-mint rounded-lg"><i data-lucide="network" class="w-5 h-5"></i></span>
                <div>
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-wider">Estado de Conexión de Fuentes</p>
                    <p class="text-xs text-cubo
