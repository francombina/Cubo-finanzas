name: Actualizar Noticias Diario

on:
  schedule:
    - cron: '0 11 * * *' # Corre solo todos los días a las 8:00 AM de Argentina
  workflow_dispatch: # Botón para probarlo manualmente cuando quieras

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Descargar noticias en vivo de portales financieros
        run: |
          cat << 'EOF' > generar_noticias.py
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          import json
          from datetime import datetime, timedelta
          import re

          # 5 búsquedas en vivo restringidas a medios financieros de primera línea y de las últimas horas
          categorias = [
              {
                  "etiqueta": "Dólar & BCRA",
                  "query": '(dolar OR reservas OR BCRA OR MEP OR CCL) (site:ambito.com OR site:cronista.com OR site:bloomberglinea.com) when:1d'
              },
              {
                  "etiqueta": "Mercados Locales",
                  "query": '(merval OR "riesgo pais" OR bonos OR acciones) (site:ambito.com OR site:cronista.com OR site:iprofesional.com) when:1d'
              },
              {
                  "etiqueta": "Macro & Finanzas",
                  "query": '(inflacion OR licitacion OR FMI OR economia OR tasas) (site:cronista.com OR site:infobae.com OR site:lanacion.com.ar) when:1d'
              },
              {
                  "etiqueta": "Wall Street",
                  "query": '("wall street" OR "S&P 500" OR Fed OR Nasdaq) (site:bloomberglinea.com OR site:ambito.com OR site:cronista.com) when:1d'
              },
              {
                  "etiqueta": "Energía & Cripto",
                  "query": '(petroleo OR "vaca muerta" OR YPF OR bitcoin OR oro) (site:bloomberglinea.com OR site:ambito.com OR site:cronista.com) when:1d'
              }
          ]

          stopwords = {'el', 'la', 'los', 'las', 'de', 'del', 'en', 'y', 'a', 'por', 'para', 'con', 'un', 'una', 'que', 'se', 'al', 'como', 'mas', 'pero', 'su', 'sus', 'hoy', 'este', 'esta', 'entre', 'tras', 'ante'}

          def obtener_palabras_clave(texto):
              palabras = re.findall(r'\w+', texto.lower())
              return set(p for p in palabras if len(p) > 3 and p not in stopwords)

          def es_similar(titulo_nuevo, titulos_existentes):
              kws_nuevo = obtener_palabras_clave(titulo_nuevo)
              if not kws_nuevo:
                  return False
              for t in titulos_existentes:
                  kws_exist = obtener_palabras_clave(t)
                  if len(kws_nuevo.intersection(kws_exist)) >= 3:
                      return True
              return False

          noticias = []
          titulos_usados = []

          for cat in categorias:
              q_encoded = urllib.parse.quote(cat["query"])
              url = f"https://news.google.com/rss/search?q={q_encoded}&hl=es-419&gl=AR&ceid=AR:es-419"
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      xml_data = response.read()
                  
                  root = ET.fromstring(xml_data)
                  items = root.findall('.//item')
                  
                  for item in items:
                      raw_title = item.find('title').text if item.find('title') is not None else ''
                      source_el = item.find('source')
                      fuente = source_el.text if source_el is not None else 'Mercado'
                      
                      partes = raw_title.rsplit(' - ', 1)
                      titulo_limpio = partes[0].strip()
                      if len(partes) > 1 and fuente == 'Mercado':
                          fuente = partes[1].strip()
                      
                      # Descartar notas de relleno tipo "a cuánto cotiza hoy en Mendoza/Córdoba"
                      if any(x in titulo_limpio.lower() for x in ['mendoza', 'córdoba', 'rosario', 'minuto a minuto', 'en vivo:']):
                          continue

                      if len(titulo_limpio) < 25 or es_similar(titulo_limpio, titulos_usados):
                          continue
                      
                      noticias.append({
                          'titulo': titulo_limpio,
                          'descripcion': f"{cat['etiqueta']} • Fuente: {fuente}"
                      })
                      titulos_usados.append(titulo_limpio)
                      break
              except Exception as e:
                  print(f"Error en categoria {cat['etiqueta']}: {e}")

          fecha_ar = (datetime.utcnow() - timedelta(hours=3)).strftime('%d/%m/%Y %H:%M hs')

          if len(noticias) > 0:
              data = {
                  'fecha': fecha_ar,
                  'noticias': noticias
              }
              with open('noticias.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=4)
              print(f"Éxito: {len(noticias)} noticias en vivo guardadas.")
          EOF
          python generar_noticias.py
          rm generar_noticias.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name 'Cubo Bot'
          git config --global user.email 'bot@cubofinanzas.com'
          git add noticias.json
          git commit -m "Actualización automática de noticias en vivo" || exit 0
          git push
